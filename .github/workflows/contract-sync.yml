# Vendored-contract drift check.
#
# CLAUDE.md and .claude/settings.json are OWNED BY ContextEng and vendored here,
# so a project generated from this template is self-contained and works offline.
# Copies drift, so they are checked rather than trusted.
#
# WHY THIS DOES NOT FAIL ON PUSH
# ------------------------------
# Divergence has three causes and only one is a defect:
#
#   1. Someone edited the vendored copy here instead of upstream.  <- the defect
#   2. Upstream moved ahead and the copy was not re-vendored.      <- needs action
#   3. This repo pushed first and upstream lands minutes later.    <- transient
#
# Content alone cannot tell 1 from 3: in both, the copy holds bytes upstream has
# never had. The first version of this workflow failed on push, and went red
# twice in one afternoon for cause 3 — a benign ordering artifact that resolved
# by itself. A check that cries wolf gets muted, and a muted check is worse than
# no check, because it still looks like coverage.
#
# So: push and PR runs REPORT (job summary, always green). The DAILY run
# ENFORCES, by which point cause-3 divergence has resolved on its own and what
# remains is genuinely 1 or 2. Worst case a bad local edit lives ~24h in a
# vendored document — the correct severity for this class of problem.
#
# Fix reported drift with `make vendor`. Never hand-edit the copies: make the
# change upstream in ContextEng, then re-vendor. A local edit is reverted by the
# next `make vendor`, and this check is what warns you before that happens.
name: contract-sync
on:
  push:
  pull_request:
  schedule:
    # Daily, not weekly: long enough that ordering artifacts have resolved,
    # short enough that a genuine local edit is caught the next morning.
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compare vendored contract against ContextEng
        id: compare
        run: |
          set -uo pipefail
          BASE=https://raw.githubusercontent.com/skrinak/ContextEng/refs/heads/main
          FILES="CLAUDE.md .claude/settings.json env.example"
          drift=""
          unreachable=""

          {
            echo "## Vendored contract vs ContextEng"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          for f in $FILES; do
            if ! curl -sSf --max-time 20 "$BASE/$f" -o /tmp/upstream 2>/dev/null; then
              # Upstream unreachable is a network fact, not a drift signal.
              unreachable="$unreachable $f"
              echo "- \`$f\` — upstream unreachable, skipped" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            if diff -q "$f" /tmp/upstream >/dev/null 2>&1; then
              echo "- \`$f\` — in sync" >> "$GITHUB_STEP_SUMMARY"
            else
              drift="$drift $f"
              {
                echo "- \`$f\` — **DRIFTED**"
                echo
                echo '<details><summary>diff (ours vs upstream)</summary>'
                echo
                echo '```diff'
                # `|| true` is load-bearing: diff exits 1 when files differ, and with
                # `set -o pipefail` under the runner's `bash -e` that killed this step —
                # so the "always green on push" contract above was never actually met.
                # Drift made the REPORT path fail red, which is the cry-wolf outcome the
                # header exists to prevent. Caught 2026-08-13 by the first real drift.
                diff -u "$f" /tmp/upstream | head -80 || true
                echo '```'
                echo
                echo '</details>'
                echo
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          done

          echo "drift=${drift# }" >> "$GITHUB_OUTPUT"
          echo "unreachable=${unreachable# }" >> "$GITHUB_OUTPUT"

          if [ -n "$drift" ]; then
            {
              echo
              echo "**Fix:** \`make vendor\`, then commit the result."
              echo
              echo "Do not hand-edit the copies. Make the change in ContextEng first —"
              echo "a local edit is silently reverted by the next re-vendor."
              echo
              echo "_If ContextEng simply has not caught up yet, ignore this. The daily"
              echo "run enforces, and by then it will have resolved._"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::Vendored contract drifted:${drift}. Run 'make vendor'. Enforced on the daily run, not on push."
          fi

      - name: Enforce (scheduled and manual runs only)
        # Push/PR runs are informational by design — see the header. This step is
        # the teeth, and it runs once transient ordering divergence has resolved.
        if: >-
          (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
          && steps.compare.outputs.drift != ''
        run: |
          echo "Vendored contract has drifted from ContextEng: ${{ steps.compare.outputs.drift }}"
          echo "This is the daily enforcement run, so it is not a push-ordering artifact."
          echo "Run 'make vendor' and commit, or make the change upstream first."
          exit 1
